<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube menu test</title>
<body style="font:16px system-ui;max-width:760px;margin:30px auto;padding:0 16px;line-height:1.5;background:#0e1116;color:#e6edf3">
<h1>YouTube right-click test</h1>
<p>For each player: press play, then <b>right-click the video</b>. Tell me which ones show a menu with <b>Stats for nerds</b>.</p>
<script>
const id='jNQXAC9IVRw',o='&origin='+encodeURIComponent(location.origin);
[['A: controls on (normal embed)','controls=1'],['B: controls off (what VLTL used)','controls=0'],['C: exact VLTL settings','controls=0&rel=0&iv_load_policy=3&cc_load_policy=0&disablekb=1&fs=0&playsinline=1']].forEach(([t,q])=>{
document.write('<h3>'+t+'</h3><iframe width="640" height="360" style="max-width:100%;border:0" allow="autoplay" src="https://www.youtube.com/embed/'+id+'?'+q+o+'"></iframe>')});
</script>
